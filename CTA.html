<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約ページ | 一杯一遊</title>
    <link rel="icon" href="img/favicon.png" sizes="any">
    <meta name="description" content="気軽に入れて遊べる大人の溜まり場ボードゲームバー">

    <!--リセットCSS-->
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">

    <!---Googleフォント変更-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Serif+JP:wght@200;400;700&family=Montserrat:wght@400;600&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!--オリジナルCSS-->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/CTA.css">


</head>

<body>

    <header class="header" id="top">
        <input type="checkbox" id="menu-toggle">
        <label for="menu-toggle" class="menu-btn">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <h1 class="logo">
            <a href="#top"><img src="img/logo.png" alt="一杯一遊"></a>
        </h1>
        <a href="CTA.html" class="reserve-btn hide-btn">
            ご予約はこちら
        </a>


        <nav class="mobile-menu">
            <ul>

                <li><a href="ippaiichiyuu.html">HOME</a></li>
                <li><a href="news.html">NEWS</a></li>
                <li><a href="contact.html">CONTACT & ACCESS</a></li>
            </ul>
        </nav>

        <label for="menu-toggle" class="overlay"></label>
    </header>


    <section class="reserve-hero">
        <div class="overlay"></div>
        <div class="hero-content">
            <p class="reserve-sub">RESERVE</p>

            <h1>
                ふらっと一杯、<br>
                ついでに一ゲーム。
            </h1>

            <p class="hero-text">
                ご予約・お問い合わせはこちらから。<br>
                内容確認後、店舗よりご連絡いたします。
            </p>
        </div>
    </section>

    <section class="reserve-section">
        <div class="reserve-card">
            <h2>Reservation Form</h2>

            <form action="https://formspree.io/f/xgoqgynn" method="POST">


                <div class="form-group">
                    <label>お名前</label>
                    <input type="text" name="name" placeholder="山田　太郎" required>
                </div>

                <div class="form-group">
                    <label>メールアドレス</label>
                    <input type="email" name="email" placeholder="メールアドレス" required>
                </div>

                <div class="form-group">
                    <label>来店希望日</label>
                    <input type="date" name="date" required>
                </div>

                <div class="form-group">
                    <label>来店時間</label>
                    <input type="time" name="time" required>
                </div>

                <div class="form-group">
                    <label>人数</label>
                    <select name="peple" required>
                        <option>1名</option>
                        <option>2名</option>
                        <option>3名</option>
                        <option>4名</option>
                        <option>5名以上</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>備考欄</label>
                    <textarea name="message" rows="5" placeholder="ご質問・貸切相談・遊びたいゲームなど"></textarea>
                </div>

                <div class="notice-box">
                    <h3>ご予約について</h3>
                    <ul>
                        <li>混雑状況により、ご希望に沿えない場合がございます。</li>
                        <li>未成年の方へのアルコール提供は行っておりません。</li>
                        <li>当日の変更・キャンセルはお電話にてご連絡ください。</li>
                    </ul>
                </div>

                <div class="privacy-check">
                    <label>
                        <input type="checkbox" name="privacy" required>
                        <a href="policy.html" target="_blank">プライバシーポリシー</a>に同意する
                    </label>
                </div>

                <button type="submit" class="submit-btn">
                    予約内容を送信する
                </button>
            </form>
        </div>
    </section>

    <footer>
        <p class="copyright">
            &copy;2026 ippaiichiyuu
        </p>
    </footer>

    <script>
        document.querySelector('form').addEventListener('submit', function (e) {
            e.preventDefault(); // Formspreeの白い画面への移動を完全にブロック

            const form = this;
            const formData = new FormData(form);
            const submitButton = form.querySelector('button[type="submit"]');

            // 送信ボタンを無効化（連打・二重送信の防止）
            if (submitButton) {
                submitButton.disabled = true;
                submitButton.innerText = '送信中...';
            }

            // バックグラウンドでFormspreeにデータを送信
            fetch(form.action, {
                method: form.method,
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            })
                .then(response => {
                    // 送信成功：同じフォルダ内の thank.html へ移動
                    window.location.href = 'thank.html';
                })
                .catch(error => {
                    // エラー発生時もユーザーを迷子にさせず thank.html へ移動
                    window.location.href = 'thank.html';
                });
        });
    </script>
</body>

</html>
